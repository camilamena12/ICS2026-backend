name: CI-CD - API E-commerce

on:
  push:
    branches:
      - feature/github-actions
      - 'test/**'
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  # JOB 1 - Quality Gate: ejecuta las pruebas unitarias y de integracion.
  # Si alguna falla, el job termina en error y el job "build" NO se ejecuta.
  run-tests:
    name: Quality Gate - Pruebas unitarias e integracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Ejecutar pruebas automatizadas
        run: dotnet test Dsw2025Tpi.sln --no-restore --verbosity normal

  # JOB 2 - Compilacion, imagen Docker y publicacion en Docker Hub.
  # Depende estrictamente del exito de run-tests (aplica a push y pull request).
  build:
    name: Build, Docker y publicacion
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Compilar solucion
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

     
      - name: Construir imagen Docker
        run: docker build -t ics2026-api:${{ github.sha }} .

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ics2026-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ics2026-api:${{ github.sha }}
# Verificacion de configuracion Docker Hub
