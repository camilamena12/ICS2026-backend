name: CI-CD - API E-commerce

on:
  push:
    branches:
      - feature/github-actions
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Compilar solucion
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Construir imagen Docker
        run: docker build -t ics2026-api:${{ github.sha }} .

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: guadasotelo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            guadasotelo/ics2026-api:latest
            guadasotelo/ics2026-api:${{ github.sha }}

